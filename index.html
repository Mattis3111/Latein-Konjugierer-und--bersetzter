<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Latein-Helfer – Konjugierer & Wörterbuch</title>

<style>
    * { box-sizing: border-box; }

    body {
        font-family: Arial, sans-serif;
        background: #f0f2f5;
        margin: 0;
        padding: 20px;
        color: #222;
    }

    .container {
        max-width: 1000px;
        margin: auto;
    }

    h1 {
        text-align: center;
        color: #8b1e1e;
    }

    .subtitle {
        text-align: center;
        color: #666;
        margin-bottom: 25px;
    }

    .card {
        background: white;
        padding: 25px;
        margin-bottom: 20px;
        border-radius: 12px;
        box-shadow: 0 3px 12px rgba(0,0,0,0.1);
    }

    input, button {
        width: 100%;
        padding: 12px;
        margin-top: 10px;
        border-radius: 7px;
        border: 1px solid #ccc;
        font-size: 16px;
    }

    button {
        background: #8b1e1e;
        color: white;
        border: none;
        cursor: pointer;
        font-weight: bold;
    }

    button:hover {
        background: #691515;
    }

    .result {
        margin-top: 20px;
        padding: 18px;
        background: #f8f8f8;
        border-left: 5px solid #8b1e1e;
        border-radius: 5px;
        overflow-x: auto;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 15px;
    }

    th, td {
        padding: 9px;
        border: 1px solid #ddd;
        text-align: left;
    }

    th {
        background: #8b1e1e;
        color: white;
    }

    .info {
        background: #fff4d6;
        padding: 12px;
        border-radius: 7px;
    }

    .time-title {
        margin-top: 30px;
        color: #8b1e1e;
    }
</style>
</head>

<body>

<div class="container">

<h1>🏛️ Latein-Helfer</h1>
<p class="subtitle">Wörterbuch · Formen analysieren · Verben konjugieren · Pronomen</p>


<!-- WORT ANALYSIEREN -->
<div class="card">

    <h2>🔎 Wort Übersetzen und Analysieren</h2>

    <input
        id="wordInput"
        type="text"
        placeholder="z. B. amant, puellas, illorum..."
    >

    <button onclick="searchWord()">Wort analysieren</button>

    <div id="result"></div>

</div>


<!-- VERB KONJUGIEREN -->
<div class="card">

    <h2>🔤 Verb konjugieren</h2>

    <p>
        Gib den Infinitiv ein, zum Beispiel:
        <strong>amare, monere, regere, capere oder audire</strong>.
    </p>

    <input
        id="verbInput"
        type="text"
        placeholder="z. B. amare"
    >

    <button onclick="conjugateVerb()">Alle Zeiten anzeigen</button>

    <div id="verbResult"></div>

</div>


<!-- PRONOMEN -->
<div class="card">

    <h2>👤 Pronomen</h2>

    <select id="pronounSelect">
        <option value="hic">hic, haec, hoc – dieser</option>
        <option value="ille">ille, illa, illud – jener</option>
        <option value="iste">iste, ista, istud – dieser da</option>
        <option value="ipse">ipse, ipsa, ipsum – selbst</option>
        <option value="is">is, ea, id – er, sie, es</option>
        <option value="qui">qui, quae, quod – welcher / der</option>
        <option value="quis">quis, quid – wer? was?</option>
        <option value="aliquis">aliquis, aliquid – jemand / etwas</option>
        <option value="ego">ego – ich</option>
        <option value="tu">tu – du</option>
        <option value="se">se – sich</option>
    </select>

    <button onclick="showPronoun()">Formen anzeigen</button>

    <div id="pronounResult"></div>

</div>

</div>


<script>

/* =====================================================
   WÖRTERBUCH

   Hier können beliebig viele Wörter ergänzt werden.
===================================================== */

const dictionary = {

    "amo": {
        type: "Verb",
        infinitiv: "amare",
        translation: "lieben",
        perfectStem: "amav"
    },

    "amant": {
        type: "Verb",
        infinitiv: "amare",
        translation: "sie lieben",
        person: "3. Person",
        numerus: "Plural",
        tempus: "Präsens"
    },

    "monere": {
        type: "Verb",
        infinitiv: "monere",
        translation: "ermahnen",
        perfectStem: "monu"
    },

    "regere": {
        type: "Verb",
        infinitiv: "regere",
        translation: "lenken, führen",
        perfectStem: "rex"
    },

    "capere": {
        type: "Verb",
        infinitiv: "capere",
        translation: "fassen, nehmen",
        perfectStem: "cep"
    },

    "audire": {
        type: "Verb",
        infinitiv: "audire",
        translation: "hören",
        perfectStem: "audiv"
    },

    "puella": {
        type: "Nomen",
        translation: "Mädchen",
        genus: "Femininum",
        forms: {
            "puella": "Nominativ Singular",
            "puellae": "Genitiv Singular / Dativ Singular / Nominativ Plural",
            "puellam": "Akkusativ Singular",
            "puella": "Ablativ Singular",
            "puellarum": "Genitiv Plural",
            "puellis": "Dativ Plural / Ablativ Plural",
            "puellas": "Akkusativ Plural"
        }
    },

    "servus": {
        type: "Nomen",
        translation: "Sklave, Diener",
        genus: "Maskulinum"
    },

    "bellum": {
        type: "Nomen",
        translation: "Krieg",
        genus: "Neutrum"
    },

    "rex": {
        type: "Nomen",
        translation: "König",
        genus: "Maskulinum"
    },

    "aqua": {
        type: "Nomen",
        translation: "Wasser",
        genus: "Femininum"
    },

    "et": {
        type: "Konjunktion",
        translation: "und"
    },

    "sed": {
        type: "Konjunktion",
        translation: "aber"
    },

    "non": {
        type: "Adverb",
        translation: "nicht"
    }

};


/* =====================================================
   VERBSTAMMFORMEN

   Für unbekannte Verben werden die regelmäßigen
   Zeiten gebildet. Für bekannte Verben kann zusätzlich
   der Perfektstamm verwendet werden.
===================================================== */

const verbData = {

    "amare": {
        translation: "lieben",
        perfectStem: "amav"
    },

    "monere": {
        translation: "ermahnen",
        perfectStem: "monu"
    },

    "regere": {
        translation: "lenken, führen",
        perfectStem: "rex"
    },

    "capere": {
        translation: "nehmen, fassen",
        perfectStem: "cep"
    },

    "audire": {
        translation: "hören",
        perfectStem: "audiv"
    }

};


/* =====================================================
   WORT ANALYSIEREN
===================================================== */

function searchWord() {

    const input = document
        .getElementById("wordInput")
        .value
        .trim()
        .toLowerCase();

    const result = document.getElementById("result");

    if (!input) {
        result.innerHTML =
            "<div class='info'>Bitte gib ein lateinisches Wort ein.</div>";
        return;
    }


    /* DIREKTES WÖRTERBUCH */

    if (dictionary[input]) {

        const word = dictionary[input];

        let html = "<div class='result'>";
        html += "<h3>Analyse: " + input + "</h3>";
        html += "<p><strong>Wortart:</strong> " + word.type + "</p>";
        html += "<p><strong>Übersetzung:</strong> " + word.translation + "</p>";

        if (word.infinitiv) {
            html += "<p><strong>Infinitiv:</strong> " +
                    word.infinitiv + "</p>";
        }

        if (word.person) {
            html += "<p><strong>Person:</strong> " +
                    word.person + "</p>";

            html += "<p><strong>Numerus:</strong> " +
                    word.numerus + "</p>";

            html += "<p><strong>Zeit:</strong> " +
                    word.tempus + "</p>";
        }

        if (word.genus) {
            html += "<p><strong>Genus:</strong> " +
                    word.genus + "</p>";
        }

        html += "</div>";

        result.innerHTML = html;
        return;
    }


    /* AUTOMATISCHE ERKENNUNG EINIGER VERBFORMEN */

    if (input.endsWith("ant")) {

        result.innerHTML =
            "<div class='result'>" +
            "<h3>Mögliche Verbform</h3>" +
            "<p><strong>Person:</strong> 3. Person</p>" +
            "<p><strong>Numerus:</strong> Plural</p>" +
            "<p><strong>Zeit:</strong> Präsens Aktiv</p>" +
            "<p>Die genaue Übersetzung und der Infinitiv hängen vom Verb ab.</p>" +
            "</div>";

        return;
    }


    /* AUTOMATISCHE NOMEN-ERKENNUNG */

    if (input.endsWith("as")) {

        result.innerHTML =
            "<div class='result'>" +
            "<h3>Mögliche Nomenform</h3>" +
            "<p><strong>Kasus:</strong> Akkusativ</p>" +
            "<p><strong>Numerus:</strong> Plural</p>" +
            "<p><strong>Hinweis:</strong> Könnte zu einem Nomen der a-Deklination gehören.</p>" +
            "</div>";

        return;
    }


    result.innerHTML =
        "<div class='result'>" +
        "<strong>Wort konnte nicht eindeutig analysiert werden.</strong>" +
        "<br>Lateinische Endungen können mehrere grammatische Bedeutungen haben." +
        "</div>";
}


/* =====================================================
   VERB KONJUGIEREN
===================================================== */

function conjugateVerb() {

    let infinitive = document
        .getElementById("verbInput")
        .value
        .trim()
        .toLowerCase();

    const result = document.getElementById("verbResult");

    if (!infinitive) {
        result.innerHTML =
            "<div class='info'>Bitte gib einen Infinitiv ein.</div>";
        return;
    }


    const persons = [
        "1. Person Singular",
        "2. Person Singular",
        "3. Person Singular",
        "1. Person Plural",
        "2. Person Plural",
        "3. Person Plural"
    ];


    let stem = "";
    let conjugation = "";
    let present = [];
    let imperfect = [];
    let future = [];


    /* A-KONJUGATION */

    if (infinitive.endsWith("are")) {

        stem = infinitive.slice(0, -2);
        conjugation = "a-Konjugation";

        present = [
            stem + "o",
            stem + "s",
            stem + "t",
            stem + "mus",
            stem + "tis",
            stem + "nt"
        ];

        imperfect = [
            stem + "bam",
            stem + "bas",
            stem + "bat",
            stem + "bamus",
            stem + "batis",
            stem + "bant"
        ];

        future = [
            stem + "bo",
            stem + "bis",
            stem + "bit",
            stem + "bimus",
            stem + "bitis",
            stem + "bunt"
        ];
    }


    /* I-KONJUGATION */

    else if (infinitive.endsWith("ire")) {

        stem = infinitive.slice(0, -2);
        conjugation = "i-Konjugation";

        present = [
            stem + "o",
            stem + "s",
            stem + "t",
            stem + "mus",
            stem + "tis",
            stem + "unt"
        ];

        imperfect = [
            stem + "ebam",
            stem + "ebas",
            stem + "ebat",
            stem + "ebamus",
            stem + "ebatis",
            stem + "ebant"
        ];

        future = [
            stem + "am",
            stem + "es",
            stem + "et",
            stem + "emus",
            stem + "etis",
            stem + "ent"
        ];
    }


    /* E- UND KONSONANTISCHE KONJUGATION */

    else if (infinitive.endsWith("ere") ||
             infinitive.endsWith("ēre")) {

        stem = infinitive.slice(0, -2);
        conjugation = "e- oder konsonantische Konjugation";

        present = [
            stem + "o",
            stem + "s",
            stem + "t",
            stem + "mus",
            stem + "tis",
            stem + "nt"
        ];

        imperfect = [
            stem + "bam",
            stem + "bas",
            stem + "bat",
            stem + "bamus",
            stem + "batis",
            stem + "bant"
        ];

        future = [
            stem + "am",
            stem + "es",
            stem + "et",
            stem + "emus",
            stem + "etis",
            stem + "ent"
        ];
    }

    else {

        result.innerHTML =
            "<div class='result'>" +
            "Dieses Wort sieht nicht wie ein lateinischer Infinitiv aus." +
            "</div>";

        return;
    }


    /* PERFEKTSTAMM SUCHEN */

    let perfectStem = null;

    if (verbData[infinitive]) {
        perfectStem = verbData[infinitive].perfectStem;
    }


    let perfect = [];
    let pluperfect = [];

    if (perfectStem) {

        perfect = [
            perfectStem + "i",
            perfectStem + "isti",
            perfectStem + "it",
            perfectStem + "imus",
            perfectStem + "istis",
            perfectStem + "erunt"
        ];

        pluperfect = [
            perfectStem + "eram",
            perfectStem + "eras",
            perfectStem + "erat",
            perfectStem + "eramus",
            perfectStem + "eratis",
            perfectStem + "erant"
        ];
    }


    /* AUSGABE */

    let html =
        "<div class='result'>" +
        "<h3>" + infinitive + "</h3>" +
        "<p><strong>Erkannte Konjugation:</strong> " +
        conjugation + "</p>";


    function createTable(title, forms) {

        html += "<h3 class='time-title'>" + title + "</h3>";
        html += "<table>";
        html += "<tr><th>Person</th><th>Lateinische Form</th></tr>";

        forms.forEach(function(form, index) {

            html += "<tr>";
            html += "<td>" + persons[index] + "</td>";
            html += "<td><strong>" + form + "</strong></td>";
            html += "</tr>";

        });

        html += "</table>";
    }


    createTable("Präsens Aktiv", present);
    createTable("Imperfekt Aktiv", imperfect);
    createTable("Futur I Aktiv", future);


    if (perfectStem) {

        createTable("Perfekt Aktiv", perfect);
        createTable("Plusquamperfekt Aktiv", pluperfect);

    } else {

        html +=
            "<div class='info'>" +
            "<strong>Perfekt und Plusquamperfekt:</strong> " +
            "Für diese Zeiten wird der Perfektstamm benötigt. " +
            "Dieses Verb ist noch nicht mit Stammformen im Wörterbuch gespeichert." +
            "</div>";

    }


    html += "</div>";

    result.innerHTML = html;
}

===================================================== */

    ego: {

/* =====================================================
   PRONOMEN ANZEIGEN
===================================================== */

function showPronoun() {

    const selected =
        document.getElementById("pronounSelect").value;

    const pronoun = pronouns[selected];

    let html =
        "<div class='result'>" +
        "<h3>" + pronoun.title + "</h3>" +
        "<table>";

    pronoun.forms.forEach(function(row, rowIndex) {

        html += "<tr>";

        row.forEach(function(cell) {

            if (rowIndex === 0) {
                html += "<th>" + cell + "</th>";
            } else {
                html += "<td>" + cell + "</td>";
            }

        });

        html += "</tr>";

    });

    html += "</table></div>";

    document.getElementById("pronounResult").innerHTML =
        html;
}

</script>

</body>
</html>
